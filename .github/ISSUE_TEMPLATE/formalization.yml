name: End-to-end formalization work item
description: セール『数論講義』の1つのwork itemを解釈・Lean・Blueprint・CIまで単一レーンでend-to-end形式化する
title: "Formalize: "
body:
  - type: markdown
    attributes:
      value: |
        書籍本文・ページ画像はIssueへ転載せず、章・節・定理番号などの参照情報と数学的目標を記載してください。
        現行運用は単一レーンです。実装開始時は docs/ACTIVE_WORK.md に1件だけ ACTIVE を置き、mergeまたはparkするまで別の数学的実装PRを開始しません。

  - type: input
    id: work_id
    attributes:
      label: Work ID
      description: docs/WORK_QUEUE.md と一致する安定ID。
      placeholder: "例: S3.3-QuadraticReciprocity"
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: Source location
      description: 章・節・定理番号・ページなど。本文そのものは貼らない。
      placeholder: "例: 第1章 §3.3 定理6"
    validations:
      required: true

  - type: textarea
    id: target
    attributes:
      label: Mathematical target
      description: 形式化したい数学的内容を独立した言葉で記載する。未確定部分があれば明記する。
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Mathematical dependencies
      description: main上で必要な定理、またはpreflightで確認すべきdependencyを記載する。
    validations:
      required: true

  - type: dropdown
    id: queue_state
    attributes:
      label: Initial queue state
      options:
        - READY
        - PREFLIGHT
        - WAITING
        - BLOCKED
    validations:
      required: true

  - type: input
    id: branch
    attributes:
      label: Work branch
      description: activeになった時に使うwork item固有branch。未activeなら予定名でよい。
      placeholder: "例: work/s3-3-quadratic-reciprocity"
    validations:
      required: true

  - type: checkboxes
    id: outputs
    attributes:
      label: End-to-end outputs
      options:
        - label: Mathematical interpretation and dependency audit
          required: true
        - label: Mathlib API / near-target theorem review
          required: true
        - label: Lean statement and proof without placeholders
          required: true
        - label: Independent natural-language explanation
          required: true
        - label: Blueprint nodes / dependencies / Lean linkage
          required: true
        - label: Policy / lake build / vbp build / CI
          required: true
        - label: Progress / queue / active-work synchronization
          required: true

  - type: textarea
    id: risk
    attributes:
      label: Ambiguities / stop conditions
      description: statementの解釈、dependency不確定、強すぎるmathlib定理、出典上の懸念、shared hotspot等を記載する。
